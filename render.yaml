services:
  - type: web
    name: CarsTUmotor
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: ohio
    
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://carstumotor.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-aged-wildflower-apjbh3lt-pooler.c-7.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
    
    # Dockerfile multi-stage ya hace composer install + npm build; no duplicar
    buildCommand: ""
    preDeployCommand: php artisan migrate --force --no-interaction
    
    healthCheckPath: /up
    domains:
      - carstumotor.onrender.com
